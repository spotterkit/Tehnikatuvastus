<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TEHNIKA TUVASTAMINE</title>

<!-- "Lisa avaekraanile" seaded — käivitub täisekraanil, ilma brauseri ribata -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14170f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tehnikatuvastus">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#14170f;
    --bg-1:#1b1f15;
    --panel:#20241a;
    --panel-2:#262b1d;
    --line:#3a4030;
    --bone:#d9d9c4;
    --bone-dim:#9a9d87;
    --olive:#8a9a5b;
    --olive-dim:#5c6640;
    --amber:#c9a227;
    --red:#b0432f;
    --green:#6f9a4a;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #232819 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #1c2013 0%, transparent 55%),
      var(--bg-0);
    color:var(--bone);
    font-family:var(--font-mono);
    min-height:100vh;
    padding:28px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:940px;margin:0 auto;}

  /* history nav */
  .hist-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .nav-btn{
    font-family:var(--font-mono);
    font-size:16px;
    line-height:1;
    padding:9px 16px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--bone);
    cursor:pointer;
    min-width:46px;
    transition:background 0.15s, border-color 0.15s, color 0.15s;
  }
  .nav-btn:hover:not(:disabled){border-color:var(--olive);color:var(--olive);}
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .hist-status{
    flex:1;
    text-align:center;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--bone-dim);
  }
  .hist-status.live{color:var(--olive);}

  /* header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:22px;
    gap:12px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.22em;
    color:var(--olive);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(26px,5vw,38px);
    letter-spacing:0.02em;
    margin:0;
    color:var(--bone);
    text-transform:uppercase;
  }
  h1 span{color:var(--amber);}
  h1.clickable{cursor:pointer;}
  h1.clickable:hover{opacity:0.85;}
  .scorebox{
    font-family:var(--font-mono);
    text-align:right;
    line-height:1.5;
    border:1px solid var(--line);
    background:var(--panel);
    padding:8px 14px;
    min-width:150px;
  }
  .scorebox .lbl{font-size:10px;letter-spacing:0.14em;color:var(--bone-dim);text-transform:uppercase;}
  .scorebox .val{font-size:20px;font-weight:600;color:var(--olive);}
  .scorebox .val .slash{color:var(--bone-dim);font-weight:400;}
  .scorebox .pct{font-size:12px;color:var(--bone-dim);margin-top:2px;}

  /* viewfinder */
  .scope{
    position:relative;
    border:1px solid var(--line);
    background:#0d0f0a;
    overflow:hidden;
    margin-bottom:2px;
    height:min(64vh, 680px);
    min-height:300px;
  }
  .scope img{
    width:100%;height:100%;object-fit:contain;
    background:#0a0c07;
    display:block;
  }
  .corner{
    position:absolute;width:26px;height:26px;
    border-color:var(--amber);
    opacity:0.85;
    pointer-events:none;
  }
  .corner.tl{top:8px;left:8px;border-top:2px solid;border-left:2px solid;}
  .corner.tr{top:8px;right:8px;border-top:2px solid;border-right:2px solid;}
  .corner.bl{bottom:8px;left:8px;border-bottom:2px solid;border-left:2px solid;}
  .corner.br{bottom:8px;right:8px;border-bottom:2px solid;border-right:2px solid;}
  .crosshair{
    position:absolute;top:50%;left:50%;
    width:34px;height:34px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.4s ease;
  }
  .scope.ready .crosshair{opacity:0.35;}
  .crosshair::before,.crosshair::after{
    content:'';position:absolute;background:var(--olive);
  }
  .crosshair::before{top:50%;left:0;width:100%;height:1px;transform:translateY(-50%);}
  .crosshair::after{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%);}
  .hud-tag{
    position:absolute;bottom:8px;left:8px;
    font-size:10px;letter-spacing:0.12em;
    color:var(--olive);background:rgba(13,15,10,0.72);
    padding:3px 7px;text-transform:uppercase;
  }
  .hud-status{
    position:absolute;top:8px;right:8px;
    font-size:10px;letter-spacing:0.12em;
    color:var(--bone-dim);background:rgba(13,15,10,0.72);
    padding:3px 7px;text-transform:uppercase;
  }
  .state-msg{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;
    color:var(--bone-dim);
    font-size:12px;letter-spacing:0.1em;text-transform:uppercase;
    text-align:center;
    padding:20px;
  }
  .spinner{
    width:22px;height:22px;
    border:2px solid var(--olive-dim);
    border-top-color:var(--olive);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* control panel */
  .panel{
    border:1px solid var(--line);
    border-top:none;
    background:var(--panel);
    padding:16px;
  }
  .row{display:flex;gap:10px;}
  input[type=text]{
    flex:1;
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--bone);
    font-family:var(--font-mono);
    font-size:15px;
    padding:11px 12px;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--olive);}
  input[type=text]::placeholder{color:var(--bone-dim);}

  button{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:11px 16px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--bone);
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s, color 0.15s;
    white-space:nowrap;
  }
  button:hover{border-color:var(--olive);color:var(--olive);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.primary{background:var(--olive-dim);border-color:var(--olive-dim);color:var(--bone);}
  button.primary:hover{background:var(--olive);border-color:var(--olive);color:#12140c;}
  button.good{border-color:var(--green);color:var(--green);}
  button.good:hover{background:var(--green);color:#0d0f0a;}
  button.bad{border-color:var(--red);color:var(--red);}
  button.bad:hover{background:var(--red);color:#0d0f0a;}

  .answer-block{
    margin-top:14px;
    border-top:1px dashed var(--line);
    padding-top:14px;
  }
  .answer-block .lbl{
    font-size:10px;letter-spacing:0.14em;color:var(--bone-dim);
    text-transform:uppercase;margin-bottom:4px;
  }
  .answer-block .value{
    font-family:var(--font-display);
    font-size:22px;font-weight:600;
    color:var(--amber);
    letter-spacing:0.01em;
    margin-bottom:10px;
  }
  .filename{
    font-size:12px;color:var(--bone-dim);
    word-break:break-word;
    margin-bottom:12px;
  }
  .filename a{color:var(--olive);text-decoration:none;border-bottom:1px dotted var(--olive-dim);}
  .filename a:hover{color:var(--amber);}
  .your-guess{
    font-size:12px;color:var(--bone-dim);margin-bottom:10px;
  }
  .your-guess b{color:var(--bone);font-weight:600;}

  .verdict-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .verdict-row button{flex:1;}

  .verdict-badge{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:10px 14px;
    border:1px solid var(--line);
    margin-bottom:12px;
  }
  .verdict-badge.good{border-color:var(--green);color:var(--green);}
  .verdict-badge.bad{border-color:var(--red);color:var(--red);}

  .credit{
    font-size:10px;color:var(--bone-dim);
    margin-top:14px;line-height:1.6;
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .credit a{color:var(--olive-dim);}

  footer{
    text-align:center;
    font-size:10px;
    color:var(--bone-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-top:26px;
    opacity:0.7;
  }

  @media(max-width:480px){
    .verdict-row{flex-direction:column;}
    .row{flex-direction:column;}
  }

  /* home / menu screen */
  .home-eyebrow{
    font-size:11px;letter-spacing:0.14em;color:var(--bone-dim);
    text-transform:uppercase;margin-bottom:14px;
  }
  .home-group-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .group-btn{
    width:100%;text-align:left;
    padding:13px 14px;
    font-size:13px;letter-spacing:0.04em;text-transform:none;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .group-btn .cnt{font-size:11px;color:var(--bone-dim);letter-spacing:0.08em;}
  .home-divider{
    border-top:1px dashed var(--line);
    margin:18px 0 16px;
    font-size:10px;letter-spacing:0.14em;color:var(--bone-dim);
    text-transform:uppercase;padding-top:14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow"></div>
      <h1 id="titleHome" class="clickable" title="Tagasi menüüsse">TEHNIKA<span>TUVASTUS</span></h1>
    </div>
    <div class="scorebox">
      <div class="lbl">Tulemus</div>
      <div class="val"><span id="scoreCorrect">0</span><span class="slash"> / </span><span id="scoreTotal">0</span></div>
      <div class="pct" id="scorePct">—</div>
    </div>
  </header>

  <div class="panel" id="homeScreen">
    <div class="home-eyebrow">Vali režiim</div>
    <div class="home-group-grid" id="groupGrid"></div>
    <div class="home-divider">Testid</div>
    <div class="row">
      <button class="primary" id="startTestBtn" style="flex:1;">Genereeri test (50 küsimust)</button>
    </div>
    <div class="home-divider">Vaba sirvimine</div>
    <div class="row">
      <button id="startCatalogBtn" style="flex:1;">Vaata kogu kataloogi</button>
    </div>
  </div>

  <div id="runScreen" style="display:none;">

    <div class="hist-nav">
      <button id="menuBtn" class="nav-btn" aria-label="Menüüsse" title="Tagasi menüüsse">☰</button>
      <button id="histPrev" class="nav-btn" aria-label="Eelmine">‹</button>
      <div class="hist-status live" id="histStatus">LIVE</div>
      <button id="histNext" class="nav-btn" aria-label="Järgmine" disabled>›</button>
    </div>

    <div class="scope" id="scope">
      <div class="crosshair"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="hud-tag" id="hudCat">—</div>
      <div class="hud-status" id="hudStatus">OOTEL</div>
      <img id="photo" alt="" style="display:none;">
      <div class="state-msg" id="stateMsg">
        <div class="spinner"></div>
        <div>Laen pilti...</div>
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <input type="text" id="guessInput" placeholder="Kirjuta oma vastus (nt T-72, Su-25...)" autocomplete="off">
        <button class="primary" id="revealBtn">Näita vastust</button>
      </div>

      <div class="answer-block" id="answerBlock" style="display:none;">
        <div class="your-guess" id="yourGuess"></div>
        <div class="lbl">Õige vastus</div>
        <div class="value" id="correctValue">—</div>
        <div class="filename" id="fileLine"></div>

        <div class="verdict-row" id="verdictRow">
          <button class="good" id="markGood">✓ Läks täppi</button>
          <button class="bad" id="markBad">✗ Ei läinud täppi</button>
        </div>
        <div class="row" id="practiceNextRow" style="display:none;">
          <button class="primary" id="practiceNextBtn" style="flex:1;">Järgmine pilt (Enter) →</button>
        </div>
        <div class="verdict-badge" id="verdictBadge" style="display:none;"></div>

        <div class="credit" id="credit"></div>
      </div>

      <div class="row" style="margin-top:12px;" id="skipRow">
        <button id="skipBtn" style="flex:1;">Jäta vahele (uus pilt)</button>
      </div>

      <div class="row" id="endActionsRow" style="display:none;margin-top:12px;">
        <button class="primary" id="endRestartBtn" style="flex:1;">Alusta uuesti</button>
        <button id="endMenuBtn" style="flex:1;">Tagasi menüüsse</button>
      </div>
    </div>

  </div>

  <footer>Pildid: Wikimedia Commons · Vene Föderatsiooni sõjatehnika</footer>
</div>

<script>
// ============================================================================
// KUREERIMINE — SAMM-SAMMULT
// ============================================================================
// App näitab AINULT pilte, mille failinime oled ise `files: []` massiivi
// lisanud. Kui mõne tehnikaühiku `files` on tühi, jäetakse see lihtsalt
// vahele (seda ei kuvata kunagi) — nii et enne mängimist tuleb vähemalt
// mõnele tehnikaühikule pildid lisada.
//
// 1) Ava Commonsi kategooria brauseris. URL on:
//    https://commons.wikimedia.org/wiki/Category:<cat väärtus, tühikud → _>
//    Nt T-72B3 puhul: https://commons.wikimedia.org/wiki/Category:T-72B3
//    (Väli `cat` on jäetud iga rea juurde ainult mugavaks viiteks, koodi
//    töösse see enam ei puutu.)
//
// 2) Sirvi pisipilte. Klõpsa neile, mis näitavad TERVET masinat selgelt,
//    mõistlikust kaugusest (külg-, ¾- või eestvaade on tavaliselt kõige parem).
//
// 3) Faili lehel on ülal pealkiri kujul "File:Mingi_nimi_2020.jpg".
//    Kopeeri TÄPSELT see osa, mis tuleb pärast "File:" — "File:" ennast
//    massiivi EI PANE.
//
// 4) Otsi (Ctrl+F) sellest failist õige tehnika rida allpool ja lisa
//    kopeeritud failinimi jutumärkides `files` massiivi, komaga eraldatult:
//
//    files: ["Täpne failinimi 1.jpg", "Täpne failinimi 2.jpg"]
//
// 5) Salvesta fail ja lae see brauseris uuesti — kontrolli, et pilt laadib.
//    Kui kirjutasid failinime valesti, jätab app selle vahele ja proovib
//    järgmist tehnikaühikut.
//
// Sama tehnika kohta tasub lisada 5-10 head pilti, et sama pilt liiga
// tihti ei korduks. App ei näita mitte ühtegi pilti (ükskõik millisest
// tehnikaühikust) teist korda enne, kui KÕIK kureeritud pildid kõikide
// tehnikaühikute peale kokku on vähemalt korra läbi käidud — alles siis
// algab uus tsükkel uuesti segatud järjekorras.
//
// NB: väli `weight` on nüüd kasutuseta (jäetud alles ainult viitena/hilisemaks
// kasutuseks) — range "mitte kordust enne kui kõik läbi" tähendab, et kõik
// pildid on tsükli sees täpselt võrdse tõenäosusega.
// ============================================================================

// weight = kui tihti see tüüp keskmiselt "kotist" tuleb (suurem = sagedamini).
// Levinumad/rohkem dokumenteeritud masinad said kõrgema kaalu.
const CATEGORIES = [
  // Tankid
  { label: "T-72", group: "armor", cat: "T-72", weight: 2, files: ["T-72_Ruske_vojske_-_Odbrana_slobode_2019_Niš_1.jpg", "Kazan_T-72_2024-07-18_2451.jpg", "Танк_Т-72Б.jpg", "Sloboda_2019_-_Ruski_T-72_02.jpg", "Dmitry_Medvedev_in_Orenburg_Oblast_26_September_2008-7.jpg"] },
  { label: "T-80", group: "armor", cat: "T-80", weight: 2, files: ["4thTankBrigade_-_T-80U_-01.jpg/960px-4thTankBrigade_-_T-80U_-01.jpg", "4thTankBrigade_-_T-80U_-11.jpg", "T-80BVM.jpg", "T-80BVM_%282%29.jpg"] },
  { label: "T-90M", group: "armor", cat: "T-90M", weight: 2, files: ["T-90M.jpg", "Т-90М.jpg", "T-90M_MBT_Army-2022_2022-08-20_2397.jpg", "Zapad_2017_%28Proving_Ground_Luzhsky%29_02.jpg", "Army-2023_vehicle_showcase_16.jpg"] },
  { label: "T-90A", group: "armor", cat: "T-90A", weight: 2, files: ["Moscow_2012_Victory_Day_Parade_Rehearsal%2C_T-90_tank%2C_Russia.jpg", "T-90A_front_Army-2016.jpg", "T-90A_MBT_photo011.jpg", "T-90A_with_OPVT_wading_snorkel_during_river_crossing_training_-_September_2023_01.jpg"] },
  { label: "T-62", group: "armor", cat: "T-62", weight: 2, files: ["VNPA_T-62_-_092025.jpg"] },

  // Jalaväe ja dessandi lahingumasinad / soomustransportöörid
  { label: "BMP-2", group: "armor", cat: "BMP-2", weight: 3, files: ["BMP-2_of_Russian_Ground_Forces.jpg", "BMP-2_%281%29.jpg", "BMP-2_-_TankBiathlon14part1-11.jpg" ] },
  { label: "BMP-3", group: "armor", cat: "BMP-3", weight: 2, files: ["Destruction_of_Russian_tanks_by_Ukrainian_troops_in_Mariupol_%284%29.jpg", "BMP-3_%2841204909204%29.jpg", "BMP-3_infantry_fighting_vehicle_at_Engineering_Technologies_2012_02.jpg"] },

  { label: "BTR-82A", group: "armor", cat: "BTR-82A", weight: 3, files: ["BTR-82_%2841072268395%29.jpg", "Interpolitex2016part2-52.jpg", "BTR-82A_12april_Alabino_05.jpg"] },
  { label: "MT-LB", group: "armor", cat: "MT-LB", weight: 2, files: ["Soviet_MT-LB.JPEG/960px-Soviet_MT-LB.JPEG", "202nd_Air_Defence_Brigade_-_MT-LB_-_002.jpg"] },
  { label: "BMD-2", group: "airborne", cat: "BMD-2", weight: 2, files: ["BMD-2_-_137AirborneRegiment29.jpg", "BMD-2_-_137AirborneRegiment01.jpg", "BMD-2_-_137AirborneRegiment36.jpg"] },

  { label: "BTR-MDM", group: "airborne", cat: "BTR-MDM", weight: 2, files: ["Army2016demo-018.jpg", "Alabino22042016-50.jpg", "Ryazan_BMD4M-1200-12.jpg"] },
  { label: "BMP-1KSh", group: "recon", cat: "BMP-1KSh", weight: 1, files: ["ParkPatriot2015part10-24.jpg"] },
  { label: "R-149MA1", group: "recon", cat: "R-149MA1", weight: 1, files: ["R-149MA1_-_Engineering_technologies_2012_%282%29.jpg"] },
  { label: "R-166-0,5", group: "recon", cat: "R-166-0,5", weight: 1, files: ["R-166-0%2C5_radiostation_-_27th_Independent_Sevastopol_Guards_Motor_Rifle_Brigade_%282%29.jpg"] },
  { label: "PRP-3", group: "recon", cat: "PRP-3", weight: 1, files: [] },

// range "mitte kordust enne kui absoluutselt kõik läbi" ja "mõni tüüp sagedamini"
// on omavahel vastuolus, seega praegu on iga pilt täpselt võrdse tõenäosusega ja
// näidatakse täpselt üks kord, enne kui tsükkel algab uuesti otsast.
function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Kõik kureeritud pildid (valikuliselt filtreeritud grupi järgi) — iga pilt kotis
// täpselt üks kord, ei korrata enne kui kõik läbi (vt drawNextImage).
function buildImagePool(filterFn){
  const pool = [];
  CATEGORIES.forEach(entry => {
    if(filterFn && !filterFn(entry)) return;
    (entry.files || []).forEach(filename => {
      pool.push({ entry, filename });
    });
  });
  return shuffleArray(pool);
}

// Testi jaoks: iga tehnikaühik (masin) täpselt ÜKS kord — üks juhuslik pilt
// selle masina files[] hulgast. Nii ei saa ükski masin testis korduda.
function buildUniqueVehiclePool(n){
  const eligible = CATEGORIES.filter(e => e.files && e.files.length > 0);
  const shuffled = shuffleArray(eligible.slice());
  const chosen = shuffled.slice(0, Math.min(n, shuffled.length));
  return chosen.map(entry => {
    const filename = entry.files[Math.floor(Math.random() * entry.files.length)];
    return { entry, filename };
  });
}

let imageBag = [];
let TOTAL_IMAGES = 0; // koguarv, mida näidatakse sihtmärgi numbri kõrval
let lastShownCat = null; // eelmise näidatud pildi tehnikaühik — ei tohi kohe korduda
let shownCount = 0; // mitmes pilt praeguses ringis on juba näidatud (kõigis režiimides)

function drawNextImage(){
  if(imageBag.length === 0) return null; // terve tsükkel läbi — ei täideta automaatselt uuesti

  // Otsi kotist esimene pilt, mis EI ole sama tehnikaühik kui viimati näidatu.
  let idx = imageBag.findIndex(item => item.entry.cat !== lastShownCat);
  if(idx === -1) idx = 0; // kõik ülejäänud kotis on sama kategooria — kordust pole enam võimalik vältida

  const [draw] = imageBag.splice(idx, 1);
  return draw;
}

function setStateMsg(text, showSpinner){
  stateMsg.style.display = 'flex';
  stateMsg.innerHTML = (showSpinner ? '<div class="spinner"></div>' : '') + '<div>' + text + '</div>';
  photo.style.display = 'none';
  scope.classList.remove('ready');
}

function cleanTitle(title){
  return title.replace(/^File:/,'').replace(/\.[a-zA-Z0-9]+$/,'').replace(/_/g,' ');
}

function stripHtml(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return d.textContent.trim();
}

// Kui failinimi kopeeriti kogemata thumbnail-URL kujul (sisaldab "/960px-..." vms)
// või URL-kodeeritud kujul (%27, %2C jms), parandatakse see siin automaatselt.
function normalizeFilename(raw){
  let f = raw.trim();
  const slashIdx = f.indexOf('/');
  if(slashIdx !== -1) f = f.substring(0, slashIdx);
  if(/%[0-9A-Fa-f]{2}/.test(f)){
    try{ f = decodeURIComponent(f); }catch(e){ /* jäta muutmata */ }
  }
  return f;
}

async function fetchSpecificFile(filename){
  const title = 'File:' + normalizeFilename(filename);
  const url = 'https://commons.wikimedia.org/w/api.php?action=query'
    + '&titles=' + encodeURIComponent(title)
    + '&prop=imageinfo'
    + '&iiprop=url|size|mime|extmetadata'
    + '&iiurlwidth=1400'
    + '&format=json&origin=*';

  const res = await fetch(url);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  const pages = data.query && data.query.pages;
  if(!pages) throw new Error('empty');

  const page = Object.values(pages)[0];
  if(!page || page.missing !== undefined) throw new Error('missing-file: ' + filename);

  const ii = page.imageinfo && page.imageinfo[0];
  if(!ii || !ii.mime || !ii.mime.startsWith('image/')) throw new Error('no-imageinfo');

  const ext = ii.extmetadata || {};
  return {
    filename: cleanTitle(page.title),
    rawTitle: page.title,
    url: ii.thumburl || ii.url,
    filepageUrl: 'https://commons.wikimedia.org/wiki/' + encodeURIComponent(page.title.replace(/ /g,'_')),
    artist: stripHtml(ext.Artist && ext.Artist.value),
    license: stripHtml(ext.LicenseShortName && ext.LicenseShortName.value)
  };
}

// ============================================================================
// RENDER — kuvab kas LIVE vooru (praegune/pooleliolev) või AJALOO kirje (loetav)
// ============================================================================
function fillAnswerBlock(cur, guessText){
  yourGuess.innerHTML = guessText
    ? 'Sinu vastus: <b>' + guessText.replace(/</g,'&lt;') + '</b>'
    : 'Vastus jäeti tühjaks.';
  correctValue.textContent = cur.label;
  fileLine.innerHTML = 'Failinimi: ' + cur.filename
    + ' — <a href="' + cur.filepageUrl + '" target="_blank" rel="noopener">vaata Commonsis</a>';

  let creditText = '';
  if(cur.artist) creditText += 'Autor: ' + cur.artist + '. ';
  if(cur.license) creditText += 'Litsents: ' + cur.license + '.';
  credit.textContent = creditText || '';
}

function updateNavControls(){
  const canLeft = viewIndex === null ? history.length > 0 : viewIndex > 0;
  const canRight = viewIndex !== null;
  histPrev.disabled = !canLeft;
  histNext.disabled = !canRight;

  if(viewIndex === null){
    histStatus.textContent = 'LIVE';
    histStatus.classList.add('live');
  } else {
    histStatus.textContent = 'AJALUGU ' + (viewIndex + 1) + ' / ' + history.length;
    histStatus.classList.remove('live');
  }
}

// Skoorikast peakirjas — 'practice' režiimis loeb lihtsalt näidatud pilte,
// 'test'/'catalog' režiimis näitab õigesti/valesti tulemust nagu varem.
function updateScoreUI(){
  const scoreLbl = document.querySelector('.scorebox .lbl');
  if(appMode === 'practice'){
    scoreLbl.textContent = 'Näidatud';
    scoreCorrectEl.textContent = shownCount;
    scoreTotalEl.textContent = TOTAL_IMAGES;
    scorePctEl.textContent = '';
  } else {
    scoreLbl.textContent = 'Tulemus';
    scoreCorrectEl.textContent = score.correct;
    scoreTotalEl.textContent = score.total;
    scorePctEl.textContent = score.total > 0
      ? Math.round((score.correct / score.total) * 100) + '%'
      : '—';
  }
}

function setEndActions(){
  if(appMode === 'test'){
    endRestartBtn.textContent = 'Uus test';
    endRestartBtn.onclick = startTest;
  } else if(appMode === 'practice'){
    endRestartBtn.textContent = 'Sega uuesti';
    endRestartBtn.onclick = () => startPractice(currentGroupId);
  } else {
    endRestartBtn.textContent = 'Sega uuesti';
    endRestartBtn.onclick = startCatalog;
  }
  endMenuBtn.onclick = goHome;
}

function renderLive(){
  const isPractice = appMode === 'practice';
  verdictRow.style.display = isPractice ? 'none' : 'flex';
  practiceNextRow.style.display = 'none';
  verdictBadge.style.display = 'none';
  endActionsRow.style.display = 'none';

  if(liveState.phase === 'loading' || liveState.phase === 'error' || liveState.phase === 'end'){
    setStateMsg(liveState.message, liveState.phase === 'loading');
    answerBlock.style.display = 'none';
    guessInput.value = '';
    hudCat.textContent = liveState.phase === 'end' ? 'LÄBI' : '—';
    hudStatus.textContent = liveState.phase === 'end' ? 'LÕPP' : (liveState.phase === 'error' ? 'VIGA' : 'OTSIN...');

    const stopped = liveState.phase !== 'loading';
    guessInput.disabled = stopped;
    revealBtn.disabled = stopped;
    markGood.disabled = true;
    markBad.disabled = true;
    practiceNextBtn.disabled = true;
    skipBtn.disabled = stopped;

    if(stopped){
      setEndActions();
      endActionsRow.style.display = 'flex';
    }
    return;
  }

  const cur = liveState.current;
  photo.src = cur.url;
  photo.style.display = 'block';
  stateMsg.style.display = 'none';
  scope.classList.add('ready');
  hudCat.textContent = 'SIHTMÄRK #' + shownCount + ' / ' + TOTAL_IMAGES;
  guessInput.value = liveState.guessText;
  skipBtn.disabled = false;

  if(liveState.phase === 'ready'){
    hudStatus.textContent = 'OOTAN VASTUST';
    answerBlock.style.display = 'none';
    guessInput.disabled = false;
    revealBtn.disabled = false;
  } else { // 'revealed'
    hudStatus.textContent = 'TUVASTATUD';
    guessInput.disabled = true;
    revealBtn.disabled = true;
    fillAnswerBlock(cur, liveState.guessText);
    answerBlock.style.display = 'block';
    if(isPractice){
      practiceNextRow.style.display = 'flex';
      practiceNextBtn.disabled = false;
    } else {
      markGood.disabled = false;
      markBad.disabled = false;
    }
  }
}

function renderHistory(entry){
  photo.src = entry.current.url;
  photo.style.display = 'block';
  stateMsg.style.display = 'none';
  scope.classList.add('ready');
  hudCat.textContent = 'AJALUGU';

  guessInput.value = entry.guess;
  guessInput.disabled = true;
  revealBtn.disabled = true;
  skipBtn.disabled = true;
  practiceNextRow.style.display = 'none';
  endActionsRow.style.display = 'none';

  fillAnswerBlock(entry.current, entry.guess);
  answerBlock.style.display = 'block';

  verdictRow.style.display = 'none';
  verdictBadge.style.display = 'inline-block';

  if(entry.isCorrect === null){
    hudStatus.textContent = 'HARJUTUS';
    verdictBadge.textContent = '○ Harjutus — vastust ei hinnatud';
    verdictBadge.className = 'verdict-badge';
  } else {
    hudStatus.textContent = entry.isCorrect ? 'TUVASTATUD' : 'MÖÖDA';
    verdictBadge.textContent = entry.isCorrect ? '✓ Sina märkisid: LÄKS TÄPPI' : '✗ Sina märkisid: EI LÄINUD TÄPPI';
    verdictBadge.className = 'verdict-badge ' + (entry.isCorrect ? 'good' : 'bad');
  }
}

function render(){
  if(viewIndex === null){
    renderLive();
  } else {
    renderHistory(history[viewIndex]);
  }
  updateNavControls();
}

// ============================================================================
// VOORU LOOGIKA
// ============================================================================
function endMessage(){
  if(appMode === 'test'){
    const pct = score.total > 0 ? Math.round((score.correct / score.total) * 100) : 0;
    return 'TEST LÄBI — tulemus: ' + score.correct + ' / ' + score.total + ' (' + pct + '%).';
  }
  if(appMode === 'practice'){
    const g = GROUPS.find(g => g.id === currentGroupId);
    return 'Kategooria läbi — kõik "' + (g ? g.label : currentGroupId) + '" pildid on selles ringis näidatud (' + shownCount + ' kokku).';
  }
  return 'LÕPP — kõik kureeritud pildid on selles ringis näidatud (' + shownCount + ' kokku).';
}

async function loadNext(){
  liveState = { phase: 'loading', current: null, guessText: '', message: 'Laen pilti...' };
  viewIndex = null; // uus voor toob alati tagasi LIVE juurde
  render();

  if(imageBag.length === 0 && shownCount === 0){
    liveState = { phase: 'error', current: null, guessText: '',
      message: 'Sellel valikul pole veel kureeritud pilte (files[] on tühi). Vali menüüst mõni teine kategooria või täienda CATEGORIES massiivi.' };
    render();
    return;
  }

  let attempts = 0;
  let bagWasEmpty = false;

  while(attempts < 8){
    attempts++;
    const draw = drawNextImage();
    if(!draw){ bagWasEmpty = true; break; }
    const { entry, filename } = draw;

    try{
      const file = await fetchSpecificFile(filename);
      const cur = { label: entry.label, cat: entry.cat, ...file };

      await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = resolve;
        img.onerror = reject;
        img.src = file.url;
      });

      lastShownCat = entry.cat;
      shownCount++;
      updateScoreUI();
      liveState = { phase: 'ready', current: cur, guessText: '', message: '' };
      render();
      guessInput.focus();
      return;
    }catch(err){
      continue;
    }
  }

  if(bagWasEmpty){
    // Kogu (filtreeritud) tsükkel on läbi käidud — ei täida kotti automaatselt
    // uuesti, vaid näitab selget lõputeadet koos "sega uuesti"/"uus test" nupuga.
    liveState = { phase: 'end', current: null, guessText: '', message: endMessage() };
    render();
    return;
  }

  liveState = { phase: 'error', current: null, guessText: '',
    message: 'Mitut pilti järjest ei õnnestunud laadida (vale failinimi või võrguprobleem). Kontrolli konsooli (F12) või failinimesid.' };
  render();
}

function reveal(){
  if(viewIndex !== null) return; // ajaloos vaadates ei saa live vooru muuta
  if(!liveState.current || liveState.phase !== 'ready') return;
  liveState.guessText = guessInput.value.trim();
  liveState.phase = 'revealed';
  render();
}

function markResult(isCorrect){
  if(viewIndex !== null) return;
  if(!liveState.current || liveState.phase !== 'revealed') return;

  score.total++;
  if(isCorrect) score.correct++;
  updateScoreUI();

  history.push({
    current: liveState.current,
    guess: liveState.guessText,
    isCorrect
  });

  loadNext();
}

// Harjutusrežiim: "Näita vastust" järel Enter (või nupp) viib kohe järgmise
// pildi juurde, ilma et peaks õige/vale valima. Ajalukku salvestatakse
// isCorrect: null, mis renderHistory()-s näidatakse neutraalse "harjutus" märkena.
function practiceAdvance(){
  if(viewIndex !== null) return;
  if(!liveState.current || liveState.phase !== 'revealed') return;

  history.push({
    current: liveState.current,
    guess: liveState.guessText,
    isCorrect: null
  });

  loadNext();
}

// ============================================================================
// REŽIIMIVALIK — kodumenüü ja kolm mängurežiimi
// ============================================================================
function showRunScreen(){
  homeScreen.style.display = 'none';
  runScreen.style.display = 'block';
}

function showHomeScreen(){
  runScreen.style.display = 'none';
  homeScreen.style.display = 'block';
}

function resetRunState(){
  score = { correct: 0, total: 0 };
  history = [];
  viewIndex = null;
  shownCount = 0;
  lastShownCat = null;
}

function countEligible(groupId){
  return CATEGORIES.filter(e => e.group === groupId && e.files && e.files.length > 0).length;
}

function renderHome(){
  groupGrid.innerHTML = '';
  GROUPS.forEach(g => {
    const n = countEligible(g.id);
    const btn = document.createElement('button');
    btn.className = 'group-btn';
    btn.innerHTML = '<span>' + g.label + '</span><span class="cnt">' + n + ' masinat</span>';
    if(n === 0){
      btn.disabled = true;
    } else {
      btn.addEventListener('click', () => startPractice(g.id));
    }
    groupGrid.appendChild(btn);
  });

  const totalEligible = CATEGORIES.filter(e => e.files && e.files.length > 0).length;
  startTestBtn.disabled = totalEligible === 0;
  startTestBtn.textContent = 'Genereeri test (' + Math.min(TEST_SIZE, totalEligible) + ' küsimust)';
}

function startPractice(groupId){
  appMode = 'practice';
  currentGroupId = groupId;
  resetRunState();
  imageBag = buildImagePool(e => e.group === groupId);
  TOTAL_IMAGES = imageBag.length;
  updateScoreUI();
  showRunScreen();
  loadNext();
}

function startTest(){
  appMode = 'test';
  currentGroupId = null;
  resetRunState();
  imageBag = buildUniqueVehiclePool(TEST_SIZE);
  TOTAL_IMAGES = imageBag.length;
  updateScoreUI();
  showRunScreen();
  loadNext();
}

function startCatalog(){
  appMode = 'catalog';
  currentGroupId = null;
  resetRunState();
  imageBag = buildImagePool(null);
  TOTAL_IMAGES = imageBag.length;
  updateScoreUI();
  showRunScreen();
  loadNext();
}

function goHome(){
  renderHome();
  showHomeScreen();
}

// --- Ajaloo navigeerimine (‹ / ›) ---
// Vasakule minnes ei puudutata live vooru olekut üldse — see jääb täpselt
// samasse faasi, kus see oli (ootab vastust / on tuvastatud), ja taastub
// muutumatuna, kui paremale klõpsates LIVE juurde tagasi tullakse.
histPrev.addEventListener('click', () => {
  if(viewIndex === null){
    if(history.length === 0) return;
    if(liveState.phase === 'ready') liveState.guessText = guessInput.value; // salvesta pooleli kirjutatud vastus
    viewIndex = history.length - 1;
  } else if(viewIndex > 0){
    viewIndex--;
  }
  render();
});

histNext.addEventListener('click', () => {
  if(viewIndex === null) return;
  if(viewIndex < history.length - 1){
    viewIndex++;
  } else {
    viewIndex = null; // tagasi LIVE juurde
  }
  render();
});

revealBtn.addEventListener('click', reveal);
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(runScreen.style.display === 'none') return; // Enter ei tee midagi kodumenüüs
  if(viewIndex !== null) return; // ajaloos vaadates Enter ei tee midagi
  // Harjutusrežiimis: kui vastus on juba näidatud, viib teine Enter otse
  // järgmise pildi juurde (ei pea hiirega "Järgmine" peale klõpsama).
  if(appMode === 'practice' && liveState.phase === 'revealed'){
    practiceAdvance();
  } else {
    reveal();
  }
});
markGood.addEventListener('click', () => markResult(true));
markBad.addEventListener('click', () => markResult(false));
practiceNextBtn.addEventListener('click', practiceAdvance);
skipBtn.addEventListener('click', () => {
  if(viewIndex !== null) return;
  loadNext();
});

menuBtn.addEventListener('click', goHome);
titleHome.addEventListener('click', goHome);
startTestBtn.addEventListener('click', startTest);
startCatalogBtn.addEventListener('click', startCatalog);

renderHome();
</script>
</body>
